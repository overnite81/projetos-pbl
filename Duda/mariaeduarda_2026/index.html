<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Cadastro de Usuários</h1>
      <p>Exemplo de aplicação Back-End com os métodos GET, POST, PUT, PATCH e DELETE.</p>
    </header>

    <section class="card">
      <h2>Novo usuário</h2>
      <form id="user-form">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" placeholder="Digite o nome" required>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="Digite o e-mail" required>
        <button type="submit">Cadastrar (POST)</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Usuários cadastrados</h2>
        <button id="atualizar" class="secondary" type="button">Atualizar lista (GET)</button>
      </div>
      <div id="lista" class="user-list"><p>Carregando usuários...</p></div>
    </section>
    <footer>Projeto educacional • Node.js + Express</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
